<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLOW AI · 무기명 후기</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css"><style> *{box-sizing:border-box}body{margin:0;background:#FFF6E4;background-image:radial-gradient(#ccc 1px,transparent 1px);background-size:18px 18px;color:#0A0A0A;font-family:'Pretendard Variable',sans-serif;word-break:keep-all;overflow-wrap:anywhere}.wrap{max-width:850px;margin:auto;padding:28px 18px}h1,h2{text-wrap:balance}h1{background:#F7931E;border:3px solid;padding:18px;box-shadow:5px 5px #111}section{background:white;border:3px solid;padding:20px;margin:28px 0;box-shadow:5px 5px #111}label{display:block;margin:14px 0 8px;font-weight:800}textarea,input{width:100%;font:inherit;padding:12px;border:2px solid #111}textarea{min-height:160px;resize:vertical}button,a.btn{min-height:44px;padding:12px 18px;background:#00589A;color:white;border:2px solid #111;font:inherit;font-weight:800;display:inline-flex;align-items:center;text-decoration:none;cursor:pointer;margin:8px 8px 8px 0}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid #6759A5;outline-offset:4px}.note{color:#475569;line-height:1.6}li{white-space:pre-wrap;padding:16px 0;border-bottom:1px solid #ddd}.consent{display:flex;gap:12px;align-items:center;min-height:44px}.consent input{width:24px;height:24px;flex:none}[hidden]{display:none!important}#message{min-height:28px}p{text-wrap:pretty}</style></head><body><main class="wrap"><a class="btn" href="index.html">강좌 안내 ←</a><h1>FLOW AI · 무기명 후기</h1><p>캐릭터 및 영상만들기 · 강사 이은희</p><section><h2>후기 남기기</h2><p class="note">이름·연락처 입력 없음 · 강사 승인 후 공개 · 개인정보 기재 금지</p><form id="reviewForm"><label for="text">좋았던 점 · 만든 결과물 · 바라는 점</label><textarea id="text" minlength="5" maxlength="1000" required placeholder="예: 캐릭터를 직접 만들고 첫 광고영상까지 완성한 경험"></textarea><p class="note" id="count">0 / 1000자</p><label class="consent"><input id="consent" type="checkbox" required><span>후기 내용의 강사 확인·승인 후 무기명 공개 동의</span></label><button id="send" type="submit" disabled>후기 보내기</button><p id="message" role="status" aria-live="polite">연결 확인 중</p></form></section><section><h2>공개 후기</h2><p class="note">승인된 후기만 표시</p><ul id="publicList"><li>불러오는 중</li></ul></section><section id="adminPanel" hidden><h2>강사 후기 승인</h2><form id="login"><label for="email">강사 이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button>강사 로그인</button></form><button id="logout" type="button" hidden>로그아웃</button><p id="adminMessage" role="status"></p><ul id="pending"></ul></section></main><script src="firebase/firebase-config.js"></script><script type="module" src="firebase/reviews.js"></script></body></html>
